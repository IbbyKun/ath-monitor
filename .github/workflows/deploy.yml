# Auto-deploy to the Hostinger pilot VPS on every push to main.
#
# Required GitHub Secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_HOST     - 187.127.207.185
#   DEPLOY_USER     - root
#   DEPLOY_SSH_KEY  - private half of the dedicated deploy keypair. The
#                     public half is already in the VPS's
#                     ~/.ssh/authorized_keys — this key can't do anything
#                     else, it's not anyone's personal login.
#
# What this does: resets /root/app on the VPS to exactly this commit, then
# rebuilds and restarts only what actually changed (Docker layer caching
# means an unrelated commit, e.g. a docs-only change, triggers no rebuilds
# and no restarts at all).
#
# What this deliberately does NOT do:
#   - Touch .env. It's gitignored and was never part of this repo's history,
#     so `git reset --hard` can't touch it regardless.
#   - Run the `migrations` profile. Backend/migrations/emp-monitor.sql is not
#     idempotent (it re-adds PRIMARY KEYs) — schema changes still need a
#     deliberate, one-off manual step, never blind automation on every push.
#   - Touch the desktop agent (Agent/). Cutting a new installer and pushing
#     it to employees is a separate, deliberate release action, not
#     something that should happen silently on every backend commit.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
    paths-ignore:
      - "Agent/**"
      - "QT/**"
      - "**.md"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /root/app
            if [ ! -f .env ]; then
              echo "No .env on the server — refusing to deploy blind. Investigate before retrying."
              exit 1
            fi
            git fetch --depth=1 origin main
            git reset --hard origin/main
            docker compose build
            docker compose up -d
            docker image prune -f

      # Checks the whole chain, not just that something answered on port 80.
      #
      # This used to curl "/" and require a 200 — which nginx serves from a
      # static file on disk. Every backend container could be dead and this
      # step would still pass, which is the one scenario a deploy smoke test
      # exists to catch. Each check below crosses a boundary the old one did
      # not: TLS termination, then nginx -> admin, then nginx -> store-logs-api
      # (the path every desktop agent posts to).
      - name: Smoke test
        run: |
          set -u
          host="workpulse.athgadlang.com"
          fail=0

          check() {
            name=$1; url=$2; want=$3
            got=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || echo 000)
            if [ "$got" = "$want" ]; then
              echo "ok   $name -> $got"
            else
              echo "FAIL $name -> $got (expected $want)  $url"
              fail=1
            fi
          }

          # Containers are recreated only when their image changed, but give a
          # restarted one a moment to bind before declaring the deploy broken.
          sleep 10

          # SPA over TLS.
          check "frontend"       "https://$host/"            200
          # nginx -> admin. 401 proves the backend answered: nginx alone cannot
          # produce this, and the SPA fallback would return 200 + HTML.
          check "admin api"      "https://$host/api/v3/"     401
          # nginx -> store-logs-api, the agent upload path.
          check "store-logs-api" "https://$host/api/v1/"     403
          # Plain HTTP still serving agents that predate the TLS cutover.
          check "http (agents)"  "http://${{ secrets.DEPLOY_HOST }}/" 200

          exit $fail
