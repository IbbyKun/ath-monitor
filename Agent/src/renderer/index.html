<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
    <title>ATH Monitor Agent</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- ── Sign in ─────────────────────────────────────────────────────── -->
    <section id="view-login" class="view">
        <header class="brand">
            <div class="brand-mark" aria-hidden="true"></div>
            <h1>ATH Monitor</h1>
            <p class="brand-sub">Sign in with your employee account</p>
        </header>

        <form id="login-form" novalidate>
            <label for="email">Email</label>
            <input id="email" type="email" autocomplete="username" required
                   placeholder="you@athgadlang.com" />

            <label for="password">Password</label>
            <input id="password" type="password" autocomplete="current-password" required />

            <!-- The server address is no longer editable. It is baked into the
                 build (DEFAULT_SERVER_URL in main/config.js), so there is
                 nothing here for someone to point at another host or mistype
                 into a support ticket. -->

            <p id="login-error" class="error" role="alert" hidden></p>

            <button id="login-btn" type="submit" class="primary">Sign in</button>
        </form>

        <!-- Shown on the sign-in screen so the version is readable without
             signing in first — the one thing worth asking for when something
             looks wrong. -->
        <p class="muted signin-meta">
            <span id="login-server">—</span> · v<span id="login-version">—</span>
        </p>
    </section>

    <!-- ── Timer ───────────────────────────────────────────────────────── -->
    <section id="view-main" class="view" hidden>
        <header class="topbar">
            <div>
                <p class="who" id="who">—</p>
                <p class="muted" id="server-label">—</p>
            </div>
            <button id="logout-btn" class="link" type="button">Sign out</button>
        </header>

        <div class="clock">
            <p class="clock-label" id="clock-label">Not tracking</p>
            <p class="clock-time" id="clock-time">00:00:00</p>
            <p class="muted" id="clock-detail">Press start when you begin work.</p>
        </div>

        <dl class="stats">
            <div><dt>Screenshots</dt><dd id="stat-shots">—</dd></div>
            <div><dt>Pending upload</dt><dd id="stat-queued">—</dd></div>
        </dl>

        <p id="notice" class="notice" hidden></p>
        <p id="main-error" class="error" role="alert" hidden></p>

        <footer class="foot">
            <span id="version">v—</span>
            <span id="conn" class="conn">●</span>
        </footer>
    </section>

    <script src="renderer.js"></script>
</body>
</html>
