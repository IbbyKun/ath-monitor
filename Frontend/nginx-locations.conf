# Shared location blocks, included by BOTH the :80 and :443 server blocks so the
# two can never drift apart. Included from inside a `server { }`, so everything
# here must be valid in server context — no `listen`, no `server_name`.
#
# IMPORTANT — upstream DNS:
# nginx resolves a hostname written literally in `proxy_pass` exactly once, at
# worker start, and caches the IP forever. Under Docker every `compose up`
# hands a container a NEW IP, so after any backend redeploy nginx keeps dialling
# a dead address and returns 502 until it is itself restarted.
# Using a *variable* in proxy_pass forces re-resolution at request time via the
# `resolver` declared in nginx.conf. Do not "simplify" these back to literal
# hostnames.

client_max_body_size 60m;   # screen recordings cap at 15 MB, screenshots well under

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# ── API: the admin service is the main backend the SPA talks to ──────────────
location /api/v3/ {
    set $admin_upstream http://admin:3000;
    proxy_pass         $admin_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# v1 admin login lives on the same service, different prefix. This is a
# longer prefix than /api/v1/ below, so nginx matches it first.
location /api/v1/auth/ {
    set $admin_auth_upstream http://admin:3000;
    proxy_pass         $admin_auth_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# ── store-logs-api: agent uploads + manual clock-in ──────────────────────────
location /api/v1/ {
    set $store_upstream http://store-logs-api:3001;
    proxy_pass         $store_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# ── WebSockets: notification bell + live monitoring ──────────────────────────
location /notification/ {
    set $ws_upstream http://web-socket-server:8080;
    proxy_pass         $ws_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_read_timeout 3600s;   # long-lived sockets must not be reaped
}

# The realtime service creates its ws server as `new WebSocket.Server({ server })`
# with no `path` option, so it accepts upgrades on ANY path — passing the /rt/
# prefix straight through is fine, and `app.get('/rt')` is its health route.
# This is what VITE_SOCKET_URL should point at over TLS
# (wss://<host>/rt/), rather than the container's published port 5002.
location /rt/ {
    set $rt_upstream http://realtime:5002;
    proxy_pass         $rt_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_read_timeout 3600s;
}

# ── SPA: every unknown path must return index.html so React Router,
#    not nginx, decides what to render (and redirects to /login).
location / {
    try_files $uri $uri/ /index.html;
}

location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|webm)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}
