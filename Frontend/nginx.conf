# Serves the built SPA and reverse-proxies the API so the browser only ever
# talks to one origin. That removes CORS from the picture entirely and means
# the frontend image is environment-agnostic — the same image works locally
# and in production, because the API host is resolved here, not baked into the JS.
#
# The actual proxy rules live in nginx-locations.conf and are included by both
# this :80 block and the :443 blocks in nginx-tls.conf, so the plaintext and TLS
# paths can never drift apart.
#
# See nginx-locations.conf for why every proxy_pass goes through a variable.
resolver 127.0.0.11 ipv6=off valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ACME HTTP-01 challenge. certbot writes into this shared volume and Let's
    # Encrypt fetches over plain HTTP on port 80 — so this must stay reachable
    # here, unredirected, for renewals to keep working. `^~` stops the regex
    # asset-caching location below from ever taking precedence.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Deliberately NOT redirected to HTTPS. Every desktop agent already
    # installed on an employee machine posts to http://<ip>/ (see
    # Agent/src/main/config.js) — a 301 would break those uploads, because
    # POST-through-redirect is unreliable and the bare IP can't match a cert
    # anyway. Port 80 keeps serving until the fleet is re-pointed at the
    # domain and a new installer has gone out.
    include /etc/nginx/app-locations.conf;
}

# TLS server blocks, mounted in only where certs actually exist (see
# docker-compose.override.example.yml). Empty on a dev laptop, so nginx starts
# on :80 alone instead of dying on a missing ssl_certificate.
include /etc/nginx/tls.d/*.conf;
