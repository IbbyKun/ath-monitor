# TLS server blocks. NOT loaded by default — this file is bind-mounted into
# /etc/nginx/tls.d/ only on hosts that actually have Let's Encrypt certs (see
# docker-compose.override.example.yml). On a dev laptop /etc/nginx/tls.d stays
# empty, so nginx serves :80 only rather than failing to start on a missing
# ssl_certificate.
#
# One certificate covers both names (workpulse + storage.workpulse), so both
# blocks point at the same live/ directory. The whole /etc/letsencrypt tree is
# mounted rather than the two leaf files: `live/` holds symlinks into
# `archive/`, and renewal repoints them at new files. Mounting the leaves would
# pin the container to the old inode and keep serving an expired cert after
# renewal — mounting the tree means `nginx -s reload` is enough.

ssl_protocols             TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache         shared:SSL:10m;
ssl_session_timeout       1d;
ssl_session_tickets       off;

# ── The app ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name workpulse.athgadlang.com;

    ssl_certificate     /etc/letsencrypt/live/workpulse.athgadlang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workpulse.athgadlang.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # HSTS is scoped to this hostname, so it does not touch the agents still
    # posting to http://<ip>/ — a bare IP cannot carry an HSTS policy at all.
    # That is why this can go on before port 80 is redirected.
    #
    # 6 months, and deliberately no `preload`: preloading is baked into browser
    # binaries and effectively permanent, whereas this expires on its own if the
    # domain is ever retired. Renewal is already automated and proven, so the
    # usual HSTS risk — a lapsed certificate locking everyone out — is covered.
    add_header Strict-Transport-Security "max-age=15768000" always;

    include /etc/nginx/app-locations.conf;
}

# ── MinIO / screenshot storage ───────────────────────────────────────────────
# Presigned S3 URLs are generated by the backend and fetched by the employee's
# browser, so the host in them has to resolve from both sides — and SigV4 signs
# the Host header, so it cannot be rewritten in flight. This subdomain is that
# one shared name; `api_endpoint` in organization_provider_credentials.creds
# must be set to exactly https://storage.workpulse.athgadlang.com. See DEPLOY.md.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name storage.workpulse.athgadlang.com;

    ssl_certificate     /etc/letsencrypt/live/workpulse.athgadlang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workpulse.athgadlang.com/privkey.pem;

    # Uploads go through the backend, not here, but MinIO must never be the
    # thing that imposes a size cap on a screen recording.
    client_max_body_size 0;

    location / {
        set $minio_upstream http://minio:9000;
        proxy_pass $minio_upstream$request_uri;
        proxy_http_version 1.1;

        # Host must survive untouched — it is part of the SigV4 signature.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream objects straight through; buffering a screen recording to disk
        # before sending a byte adds latency for no gain.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_connect_timeout   300s;
        proxy_read_timeout      300s;
    }
}
